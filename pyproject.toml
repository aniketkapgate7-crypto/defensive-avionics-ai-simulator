[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "defensive-avionics-ai-simulator"
version = "0.1.0"
description = "Offline academic simulator combining RF classification, vision, and reinforcement learning."
readme = "README.md"
requires-python = ">=3.10,<3.13"
license = {text = "MIT"}
authors = [{name = "Aniket Kapgate"}]
dependencies = [
  "numpy>=1.26,<3",
  "PyYAML>=6,<7",
]

[project.optional-dependencies]
analysis = [
  "pandas>=2.1,<3",
  "scipy>=1.11,<2",
  "matplotlib>=3.8,<4",
  "scikit-learn>=1.3,<2",
  "seaborn>=0.13,<1",
  "tqdm>=4.66,<5",
]
signal = [
  "torch>=2.2,<3",
  "h5py>=3.10,<4",
  "tensorboard>=2.15,<3",
]
policy = [
  "gymnasium>=0.29,<2",
  "stable-baselines3>=2.3,<3",
  "shimmy>=1.3,<3",
]
vision = [
  "torch>=2.2,<3",
  "torchvision>=0.17,<1",
  "ultralytics>=8.2,<9",
  "opencv-python>=4.8,<5",
]
ui = [
  "pygame>=2.5,<3",
  "streamlit>=1.36,<2",
  "streamlit-webrtc>=0.77,<1",
  "av>=14,<18",
]
dev = [
  "pytest>=8,<9",
  "ruff>=0.6,<1",
  "mypy>=1.10,<2",
]

[project.scripts]
avionics-sim = "defensive_avionics.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
