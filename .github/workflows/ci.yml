name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install project
        run: python -m pip install -e ".[dev,analysis,vision,policy]"

      - name: Check structure
        run: python scripts/check_setup.py

      - name: Run tests
        run: python -m pytest -q

      - name: Lint
        run: ruff check src tests scripts app